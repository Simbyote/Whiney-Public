# Lint and the software tests on every push and pull request.
# Windows runs too, because the app ships there and paths/line endings differ.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      # test_gui.py starts the real GUI; Linux runners need a virtual display for it
      - if: runner.os == 'Linux'
        run: sudo apt-get install -y -q xvfb
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src tests
      - run: python -m mypy
      - run: python -X warn_default_encoding -m pytest -q
      # Live tests skip without Skyrim; this keeps their fixtures from breaking unnoticed
      - run: python -X warn_default_encoding -m pytest -q --live
